version: '3'

dotenv: ['data.env', 'secrets.env', 'defaults.env']

tasks:
  gen-secrets:
    cmds:
      - "talosctl gen secrets --output-file infra/cluster/secrets/talos-secrets.yaml --force"
  gen-config:
    cmds:
      - "talosctl gen config --with-secrets infra/cluster/secrets/talos-secrets.yaml $CLUSTER_NAME https://$CONTROL_PLANE_IP:6443 --config-patch-control-plane infra/cluster/base/controlplane.yaml -o infra/cluster/.clusterconfig --force"
      - "talosctl --talosconfig=infra/cluster/.clusterconfig/talosconfig config endpoints $CONTROL_PLANE_IP"
  merge-config:
    cmds:
      - "talosctl config merge infra/cluster/.clusterconfig/talosconfig"
  rotate-secrets:
    cmds:
      - task: gen-secrets
      - task: gen-config
      - task: merge-config
  build:
    cmds:
      - "go run ./cmd -i templates/ -o infra/cluster/base/"
      - "mkdir -p infra/cluster/secrets/"
      - task: gen-secrets
      - task: gen-config
      - task: merge-config
      - "cp static_files/.gitignore infra/.gitignore"