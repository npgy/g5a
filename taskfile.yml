version: '3'

dotenv: ['data.env', 'secrets.env', 'defaults.env']

tasks:
  # shared utils
  wait:
    internal: true
    vars:
      SECONDS: 10
    cmds:
      - cmd: timeout /t {{.SECONDS}} /nobreak
        platforms: [windows]
      - cmd: sleep {{.SECONDS}}
        platforms: [linux, darwin]

  get-disks:
    cmds:
      - "talosctl get disks --insecure --nodes $CONTROL_PLANE_IP"
  talos-dashboard:
    cmds:
      - "talosctl dashboard --nodes $CONTROL_PLANE_IP"
  gen-templates:
    cmds:
      - "go run ./cmd -i templates/ -o infra/cluster/base/"
  gen-secrets:
    cmds:
      - "talosctl gen secrets --output-file infra/cluster/secrets/talos-secrets.yaml --force"
  gen-config:
    cmds:
      - "talosctl gen config --with-secrets infra/cluster/secrets/talos-secrets.yaml $CLUSTER_NAME https://$CONTROL_PLANE_IP:6443 --kubernetes-version $KUBERNETES_VERSION --config-patch-control-plane infra/cluster/base/controlplane.yaml -o infra/cluster/.clusterconfig --force"
      - "talosctl --talosconfig=infra/cluster/.clusterconfig/talosconfig config endpoints $CONTROL_PLANE_IP"
  merge-config:
    cmds:
      - "talosctl config merge infra/cluster/.clusterconfig/talosconfig"
  rotate-secrets:
    cmds:
      - task: gen-secrets
      - task: gen-config
      - task: merge-config
  build:
    cmds:
      - task: gen-templates
      - "mkdir -p infra/cluster/secrets/"
      - task: gen-secrets
      - task: gen-config
      - task: merge-config
      - "cp static_files/.gitignore infra/.gitignore"
  apply-config-insecure:
    cmds:
      - "talosctl apply-config --insecure --nodes $CONTROL_PLANE_IP --file infra/cluster/.clusterconfig/controlplane.yaml"
  apply-config:
    cmds:
      - "talosctl apply-config --nodes $CONTROL_PLANE_IP --file infra/cluster/.clusterconfig/controlplane.yaml"
  talos-bootstrap:
    cmds:
      - "talosctl bootstrap --nodes $CONTROL_PLANE_IP"
  kubeconfig:
    cmds:
      - "talosctl kubeconfig --nodes $CONTROL_PLANE_IP"
  install-cilium:
    cmds:
      - |
        helm install \
        cilium \
        cilium/cilium \
        --version $CILIUM_VERSION \
        --namespace kube-system \
        --set ipam.mode=kubernetes \
        --set kubeProxyReplacement=true \
        --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}" \
        --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}" \
        --set cgroup.autoMount.enabled=false \
        --set cgroup.hostRoot=/sys/fs/cgroup \
        --set k8sServiceHost=localhost \
        --set k8sServicePort=7445 \
        --set gatewayAPI.enabled=true \
        --set gatewayAPI.enableAlpn=true \
        --set gatewayAPI.enableAppProtocol=true
  bootstrap-k8s-and-install-cilium:
    internal: true
    cmds:
      - task: talos-bootstrap
      - task: kubeconfig
      - task: wait # takes some time for the Kubernetes API to become available after bootstrapping
        vars:
            SECONDS: 30
      - task: install-cilium
  init-bootstrap:
    cmds:
      - task: apply-config-insecure
      - task: wait # needed because talos api becomes unavailable for a short period after applying an initial config
      - task: bootstrap-k8s-and-install-cilium
  bootstrap:
    cmds:
      - task: apply-config
      - task: wait # needed because talos api becomes unavailable for a short period after applying an initial config
      - task: bootstrap-k8s-and-install-cilium