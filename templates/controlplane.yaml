apiVersion: v1alpha1
kind: UnattendedInstallConfig
# The installer describes the source of the installation.
installer:
    image: {{ env "TALOS_IMAGE" }} # Allows for supplying the image used to perform the installation.
# The provisioning describes how the installation disk should be provisioned.
provisioning:
    # Matches disks to initialize as physical volumes.
    diskSelector:
        match: disk.dev_path == "{{ env "INSTALL_DISK" }}" # CEL expression matching a disk.
    wipe: true # Indicates if the installation disk should be wiped at installation time.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# The `nodeIP` field is used to configure `--node-ip` flag for the kubelet.
nodeIP: {}
# Configures the node labels for the machine.
labels:
    node-role.kubernetes.io/control-plane: ""
{{- if eq (env "WORKLOADS_ON_CONTROLPLANE" | lower) "true" }}
    node.kubernetes.io/exclude-from-external-load-balancers:
        $patch: delete
{{ end }}
{{- if eq (env "WORKLOADS_ON_CONTROLPLANE" | lower) "true" -}}
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
{{ end }}
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
    rotate-server-certificates: true
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: true # By default, CoreDNS deployment is enabled.
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: kubelet-serving-cert-approver
url: https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/refs/tags/{{ env "KUBELET_SERVING_CERT_APPROVER_VERSION" }}/deploy/standalone-install.yaml
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: metrics-server
url: https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ env "METRICS_SERVER_VERSION" }}/components.yaml
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-gatewayclass
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-gateway
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_gateways.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-httproute
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-grpcroute
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-backendtlspolicy
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-referencegrant
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-tlsroute
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml"
---
apiVersion: v1alpha1
kind: KubeExternalManifestConfig
name: gateway-api-tcproute
url: "https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/{{ env "GATEWAY_API_VERSION" }}/config/crd/standard/gateway.networking.k8s.io_tcproutes.yaml"
{{ if eq (env "TALOS_BASIC_STORAGE" | lower) "true" -}}
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: user-storage
provisioning:
  diskSelector:
    match: "!system_disk"
  minSize: {{ env "TALOS_BASIC_STORAGE_SIZE" }}
  maxSize: {{ env "TALOS_BASIC_STORAGE_SIZE" }}
{{ end }}