apiVersion: v1alpha1
kind: UnattendedInstallConfig
# The installer describes the source of the installation.
installer:
    image: {{ env "TALOS_IMAGE" }} # Allows for supplying the image used to perform the installation.
# The provisioning describes how the installation disk should be provisioned.
provisioning:
    # Matches disks to initialize as physical volumes.
    diskSelector:
        match: disk.dev_path == "{{ env "INSTALL_DISK" }}" # CEL expression matching a disk.
    wipe: true # Indicates if the installation disk should be wiped at installation time.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# The `nodeIP` field is used to configure `--node-ip` flag for the kubelet.
nodeIP: {}
# Configures the node labels for the machine.
labels:
    node-role.kubernetes.io/control-plane: ""
{{- if eq (env "WORKLOADS_ON_CONTROLPLANE" | lower) "true" }}
    node.kubernetes.io/exclude-from-external-load-balancers:
        $patch: delete
{{ end }}
{{- if eq (env "WORKLOADS_ON_CONTROLPLANE" | lower) "true" -}}
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
{{ end }}
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
    rotate-server-certificates: true
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: true # By default, CoreDNS deployment is enabled.
{{ if eq (env "TALOS_BASIC_STORAGE" | lower) "true" -}}
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: user-storage
provisioning:
  diskSelector:
    match: "!system_disk"
  minSize: {{ env "TALOS_BASIC_STORAGE_SIZE" }}
  maxSize: {{ env "TALOS_BASIC_STORAGE_SIZE" }}
{{ end }}