apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system
spec:
  interval: 720h # 30 days
  url: https://github.com/alex1989hu/kubelet-serving-cert-approver
  ref:
    tag: {{ env "KUBELET_SERVING_CERT_APPROVER_VERSION" }}
  ignore: |
    /*
    !/deploy/standalone-install.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 5m
  timeout: 2m
  prune: true
  sourceRef:
    kind: GitRepository
    name: kubelet-serving-cert-approver
  path: "./deploy"
