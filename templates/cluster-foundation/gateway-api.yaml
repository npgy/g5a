apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 720h # 30 days
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: {{ env "GATEWAY_API_VERSION" }}
  ignore: |
    /*
    !/config/crd
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 5m
  timeout: 2m
  # CRITICAL: Prevent Flux from deleting CRDs if this manifest is altered
  prune: false 
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: "./config/crd/standard"
