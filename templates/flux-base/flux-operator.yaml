apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1m0s
  type: oci
  url: oci://ghcr.io/controlplaneio-fluxcd/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1m0s
  chart:
    spec:
      chart: flux-operator
      version: {{ env "FLUX_OPERATOR_VERSION" }}
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  values:
    crds:
      enabled: true