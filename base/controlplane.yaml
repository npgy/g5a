apiVersion: v1alpha1
kind: UnattendedInstallConfig
# The installer describes the source of the installation.
installer:
    image: factory.talos.dev/metal-installer/0749d3b51d8aa0567a5151b5df43a592c57a583b0e5e1b965e2fa098a01d98a9:v1.14.2 # Allows for supplying the image used to perform the installation.
# The provisioning describes how the installation disk should be provisioned.
provisioning:
    # Matches disks to initialize as physical volumes.
    diskSelector:
        match: disk.dev_path == "/dev/sda" # CEL expression matching a disk.
    wipe: true # Indicates if the installation disk should be wiped at installation time.
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# The `nodeIP` field is used to configure `--node-ip` flag for the kubelet.
nodeIP: {}
# Configures the node labels for the machine.
labels:
    node-role.kubernetes.io/control-plane: ""
    # node.kubernetes.io/exclude-from-external-load-balancers: "" # this prevents cilium from sending lb traffic to our control plane node
# Configures the node taints for the machine. Effect is optional.
# taints:
#     node-role.kubernetes.io/control-plane: NoSchedule
---
apiVersion: v1alpha1
kind: KubeletConfig
extraArgs:
    rotate-server-certificates: true
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: true # By default, CoreDNS deployment is enabled.
---
